name: Build ShopScope
on:
  push:
    paths:
      - 'notebooks/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/run_notebook.py
      - run: python -m playwright install chromium
      - run: python scripts/capture_mvp.py
      - name: Build office documents from notebook outputs
        run: python scripts/export_office.py
      - name: Validate artifact structure, evidence and MVP
        run: python scripts/validate_submission.py
      - name: Upload evidence and submission
        uses: actions/upload-artifact@v4
        with:
          name: ShopScope-submission
          path: |
            outputs/ShopScope_Data_Analysis.executed.ipynb
            outputs/evidence.json
            outputs/figures/
            outputs/tables/
            outputs/mvp/
            reports/
          if-no-files-found: error
      - name: Publish verified aggregate deliverables to the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source revision exists; artifact retained, publish skipped."
            exit 0
          fi
          git add reports/ outputs/evidence.json outputs/figures/ outputs/tables/ outputs/mvp/ outputs/ShopScope_Data_Analysis.executed.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Publish executed ShopScope submission [skip ci]"
            git push origin HEAD:main
          fi
